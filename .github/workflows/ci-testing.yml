name: CI Testing

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TOKEN_SECRET: ${{ secrets.TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v3
        with:
          node-version: 22
      - name: Debug (TEMPORARY)
        run: |
          if [ -z "$TOKEN_SECRET" ]; then
            echo "❌ TOKEN_SECRET is not set"
            exit 1
          else
            echo "✅ TOKEN_SECRET is set"
          fi
        env:
          TOKEN_SECRET: ${{ secrets.TOKEN_SECRET }}
      - run: npm ci
      - name: Run tests
        run: npm run test
        env:
          TOKEN_SECRET: ${{ secrets.TOKEN_SECRET }}
      - run: npm run lint
      - run: npm run -w react-frontend build
