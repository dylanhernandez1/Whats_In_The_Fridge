name: CI Testing

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TOKEN_SECRET: ${{ secrets.TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v3
        with:
          node-version: 22
      - name: Debug (TEMPORARY)
        run: echo "$MY_SECRET"
        env:
          TOKEN_SECRET: ${{ secrets.TOKEN_SECRET }}
      - run: npm ci
      - name: Run tests
        run: npm run test
        env:
          TOKEN_SECRET: ${{ secrets.TOKEN_SECRET }}
      - run: npm run lint
      - run: npm run -w react-frontend build
